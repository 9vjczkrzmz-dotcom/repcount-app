<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RepCount Pro AI - Blue Edition</title>
  <!-- TensorFlow.js + MoveNet Pose Detection -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #020617; color: #f0f9ff; min-height: 100vh; display: flex; flex-direction: column; }
    
    header { border-bottom: 1px solid #1e3a8a; background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 50; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
    .logo-area { display: flex; align-items: center; gap: 10px; }
    .logo-icon { background: #2563eb; padding: 8px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; }
    h1 { font-size: 1.25rem; font-weight: bold; background: linear-gradient(to right, #60a5fa, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .btn-blue { background-color: #2563eb; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-size: 0.875rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.2s; }
    .btn-blue:hover { background-color: #1d4ed8; }
    .btn-darkblue { background-color: #1e3a8a; color: #e0f2fe; border: 1px solid #3b82f6; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    .btn-darkblue:hover { background-color: #172554; }

    main { flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media(min-width: 1024px) { main { grid-template-columns: 2fr 1fr; } }

    .video-card { position: relative; background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 4/3; box-shadow: 0 20px 25px -5px rgba(37,99,235,0.2); border: 1px solid #1e3a8a; display: flex; align-items: center; justify-content: center; }
    video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    canvas { z-index: 10; }

    .video-badges { position: absolute; top: 16px; left: 16px; z-index: 20; display: flex; flex-direction: column; gap: 8px; }
    .badge-exercise { background: rgba(37, 99, 235, 0.9); color: white; font-size: 0.75rem; padding: 4px 12px; border-radius: 9999px; font-weight: 600; border: 1px solid rgba(96, 165, 250, 0.4); }
    .badge-form { background: rgba(15, 23, 42, 0.85); color: #38bdf8; font-size: 0.75rem; padding: 4px 12px; border-radius: 9999px; border: 1px solid rgba(56, 189, 248, 0.4); backdrop-filter: blur(4px); }

    .hud-overlay { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.85); z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .hud-overlay.hidden { display: none; }
    .hud-icon { background: rgba(37, 99, 235, 0.2); color: #60a5fa; padding: 16px; border-radius: 50%; margin-bottom: 12px; border: 1px solid rgba(96, 165, 250, 0.4); animation: pulse 1.5s infinite; }
    .hud-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 4px; color: #f0f9ff; }
    .hud-sub { font-size: 0.875rem; color: #bae6fd; max-width: 400px; margin-bottom: 16px; }
    .hud-timer { font-size: 3rem; font-weight: 900; color: #60a5fa; margin-bottom: 4px; }

    .loading-overlay { position: absolute; inset: 0; background: #020617; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    .loading-overlay.hidden { display: none; }
    .spinner { width: 40px; height: 40px; border: 4px solid #2563eb; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }

    .controls-bar { background: rgba(15, 23, 42, 0.8); border: 1px solid #1e3a8a; padding: 16px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .control-group { display: flex; align-items: center; gap: 10px; }
    .control-group label { font-size: 0.875rem; color: #93c5fd; }
    select { background: #0b0f19; border: 1px solid #1d4ed8; color: white; padding: 8px 12px; border-radius: 8px; font-size: 0.875rem; outline: none; }

    .stats-column { display: flex; flex-direction: column; gap: 16px; }
    .counter-card { background: rgba(15, 23, 42, 0.8); border: 1px solid #1e3a8a; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(37,99,235,0.1); }
    .counter-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #93c5fd; font-weight: bold; margin-bottom: 4px; }
    .counter-value { font-size: 5rem; font-weight: 900; background: linear-gradient(to right, #60a5fa, #38bdf8, #93c5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin: 10px 0; }
    .set-badge { background: #172554; color: #93c5fd; font-size: 0.75rem; padding: 2px 10px; border-radius: 9999px; border: 1px solid #2563eb; font-weight: 600; }

    .card-box { background: rgba(15, 23, 42, 0.8); border: 1px solid #1e3a8a; border-radius: 12px; padding: 16px; }
    .card-header { font-size: 0.75rem; font-weight: bold; color: #93c5fd; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
